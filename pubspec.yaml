name: threatlensia

description: "Production-grade AI Threat Modeling Assistant built with Flutter."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  dio: ^5.3.0
  file_picker: ^6.1.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_markdown: ^0.6.0
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^9.0.0
  flutter_skill: ^0.2.6
  freezed_annotation: ^2.4.1
  get_it: ^7.6.0
  go_router: ^14.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  json_annotation: ^4.8.1
  path_provider: ^2.1.0
  pdf: ^3.10.0
  posthog_flutter: ^3.1.0
  printing: ^5.11.0
  riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  sentry_flutter: ^8.0.0
  share_plus: ^8.0.0
  supabase_flutter: ^1.10.0
  uuid: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.6
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.7.1
