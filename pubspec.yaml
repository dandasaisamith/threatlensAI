name: threatlensia

description: "Production-grade AI Threat Modeling Assistant built with Flutter."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter_skill: ^0.2.6
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # HTTP Client
  dio: ^5.3.0

  # Serialization & Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Local Database (encrypted)
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # Backend & Auth
  supabase_flutter: ^1.10.0

  # Secure Storage (OWASP MASVS compliant)
  flutter_secure_storage: ^9.0.0

  # Dependency Injection
  get_it: ^7.6.0

  # Analytics & Monitoring
  posthog_flutter: ^3.1.0
  sentry_flutter: ^8.0.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  path_provider: ^2.1.0
  flutter_dotenv: ^5.1.0

  # UI Components
  flutter_markdown: ^0.6.0
  google_fonts: ^6.1.0

  # PDF Generation & Export
  pdf: ^3.10.0
  printing: ^5.11.0

  # File Handling
  file_picker: ^6.1.0
  share_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.8

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
